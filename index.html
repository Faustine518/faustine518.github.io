<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="faustine 的个人文章存档。请随意翻阅，从任何一篇、任何一句进入都可以。">
  <title>faustine — Welcome to Faustine’s Writings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-night">
  <header class="site-header">
    <a class="brand" href="index.html">faustine</a>
    <nav aria-label="主要导航">
      <a class="active" href="index.html">首页</a>
      <a href="archive.html">文章</a>
      <a href="about.html">关于</a>
    </nav>
  </header>

  <main>
    <section class="hero editorial-hero">
      <div class="hero-art book-stage">
        <button class="keepsake-book" type="button" aria-expanded="false" aria-label="打开夜读小书">
          <span class="book-spread">
            <span class="book-leaf left-leaf" aria-hidden="true">
              <span class="leaf-stars">✦　　✧</span>
              <span class="leaf-caption">a small note<br>before reading</span>
            </span>
            <span class="book-leaf right-leaf">
              <span class="inside-ornament">✦</span>
              <strong>感谢阅读</strong>
              <span>只是一些很平凡的文字</span>
              <em>祝阅读愉快</em>
              <span class="inside-ornament ornament-bottom">✧</span>
            </span>
          </span>
          <span class="book-cover">
            <img src="assets/lace-bird-book-cover.jpg" alt="墨蓝封面上蕾丝框中的黑鸟与花枝插画">
            <span class="open-hint">hover / click to open</span>
          </span>
        </button>
      </div>
      <div class="hero-copy night-copy">
        <p class="eyebrow">an archive after dusk</p>
        <h1 class="welcome">Welcome to<br>Faustine’s<br>Writings</h1>
        <p class="intro">请随意翻阅。无需从头开始，也不必依次抵达。</p>
        <a class="enter-link" href="#catalogue">进入目录 <span>↓</span></a>
      </div>
      <span class="spark spark-b" aria-hidden="true">✧</span>
    </section>

    <section class="catalogue night-catalogue" id="catalogue">
      <div class="section-heading">
        <div><p class="eyebrow">catalogue</p><h2>目录</h2></div>
        <p class="catalogue-note">按作品自由选择</p>
      </div>
      <a class="work-card paper-card" href="posts/buwangchun.html">
        <div class="work-index">01</div>
        <div class="work-info">
          <span class="pairing">minrin</span>
          <h3>不忘春</h3>
          <p>高二那年春，我看到了一生中看到过的最美的樱花。</p>
        </div>
        <span class="work-arrow">read ↗</span>
      </a>
    </section>
  </main>

  <footer>
    <p>© 2026 faustine</p>
    <p>read in your own order</p>
  </footer>
  <script>
    const book = document.querySelector('.keepsake-book');
    book.addEventListener('click', () => {
      const open = book.classList.toggle('is-open');
      book.setAttribute('aria-expanded', String(open));
      book.setAttribute('aria-label', open ? '合上夜读小书' : '打开夜读小书');
    });
    book.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        book.classList.remove('is-open');
        book.setAttribute('aria-expanded', 'false');
        book.setAttribute('aria-label', '打开夜读小书');
      }
    });
  </script>
</body>
</html>
